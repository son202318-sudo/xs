<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresh Box - Cửa hàng online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
header{background:#111;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:700}.cart{background:#fff;color:#111;border:0;border-radius:20px;padding:10px 16px;cursor:pointer}
.hero{padding:55px 6%;background:linear-gradient(135deg,#111,#444);color:white}.hero h1{font-size:42px;margin:0 0 10px}.hero p{font-size:18px}
.container{padding:30px 6%;max-width:1200px;margin:auto}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #0001}.pic{height:180px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:55px}.info{padding:16px}.price{font-weight:700;font-size:20px;margin:8px 0}.add{width:100%;padding:11px;border:0;border-radius:10px;background:#111;color:white;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center}.box{background:white;width:min(92%,500px);padding:24px;border-radius:18px;max-height:90vh;overflow:auto}
input,textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:9px}h2{margin-top:0}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}
.total{font-size:20px;font-weight:bold;margin:15px 0}.checkout{background:#111;color:white;border:0;padding:13px 18px;border-radius:10px;width:100%;cursor:pointer}
.empty{color:#777;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="logo">FRESH BOX</div><button class="cart" onclick="openCart()">🛒 Giỏ hàng (<span id="count">0</span>)</button></header>
<section class="hero"><h1>Fresh Box</h1><p>Đặt hàng online – nhanh, đơn giản, tiện lợi.</p></section>
<main class="container"><h2>Sản phẩm</h2><div class="products" id="products"></div></main>

<div class="modal" id="modal"><div class="box">
<button class="close" onclick="closeCart()">×</button><h2>Giỏ hàng</h2><div id="cartItems"></div><div class="total">Tổng: <span id="total">0₫</span></div>
<h3>Thông tin đặt hàng</h3>
<input id="name" placeholder="Họ và tên">
<input id="phone" placeholder="Số điện thoại">
<textarea id="address" placeholder="Địa chỉ giao hàng"></textarea>
<button class="checkout" onclick="order()">ĐẶT HÀNG</button>
</div></div>

<script>
const products=[
{name:"folding knife",price:199000,emoji:"🍓"},
{name:"keychain knife",price:99000,emoji:"🍊"},
{name:"sickle-shaped knife",price:219000,emoji:"🍉"},
{name:"surgical scalpel",price:69000,emoji:"🍍"}
];
let cart=[];
const money=n=>n.toLocaleString("vi-VN")+"₫";
function render(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="card"><div class="pic">${p.emoji}</div><div class="info"><b>${p.name}</b><div class="price">${money(p.price)}</div><button class="add" onclick="add(${i})">Thêm vào giỏ</button></div></div>`).join("");
document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
}
function add(i){let x=cart.find(x=>x.i===i);x?x.qty++:cart.push({i,qty:1});render();openCart();}
function openCart(){document.getElementById("modal").style.display="flex";drawCart()}
function closeCart(){document.getElementById("modal").style.display="none"}
function drawCart(){
let el=document.getElementById("cartItems");
if(!cart.length){el.innerHTML='<div class="empty">Giỏ hàng đang trống.</div>';document.getElementById("total").textContent="0₫";return}
el.innerHTML=cart.map(x=>`<p>${products[x.i].name} × ${x.qty} — <b>${money(products[x.i].price*x.qty)}</b> <button onclick="removeItem(${x.i})">Xóa</button></p>`).join("");
document.getElementById("total").textContent=money(cart.reduce((s,x)=>s+products[x.i].price*x.qty,0));
}
function removeItem(i){cart=cart.filter(x=>x.i!==i);render();drawCart()}
async function order(){
  if(!cart.length)return alert("Giỏ hàng đang trống!");

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();

  if(!name||!phone||!address)
    return alert("Vui lòng nhập đủ thông tin giao hàng!");

  const products=cart.map(item =>
    `${item.name} x ${item.qty} = ${(item.price*item.qty).toLocaleString("vi-VN")}₫`
  ).join("\n");

  const total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);

  const response=await fetch("https://formspree.io/f/mvkonebw",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Accept":"application/json"
    },
    body:JSON.stringify({
      "Họ và tên":name,
      "Số điện thoại":phone,
      "Địa chỉ":address,
      "Sản phẩm":products,
      "Tổng tiền":total.toLocaleString("vi-VN")+"₫"
    })
  });

  if(response.ok){
    alert("Đặt hàng thành công! Chủ shop sẽ liên hệ xác nhận.");
    cart=[];
    render();
    closeCart();
  }else{
    alert("Gửi đơn thất bại, vui lòng thử lại!");
  }
}
render();
</script>
</body></html>
